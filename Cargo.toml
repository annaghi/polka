[package]
name = "polka"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = false

[dependencies]
html5ever = "0.39.0"
indexmap = "2.13.0"
# jotdown = "0.9.1" # Adapted state machine: src/core/utils/jotdown_attrs.rs
markdown-it = "0.6.1"
quick-xml = "0.39.2"

[dev-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
libtest-mimic = "0.8.2"
tempfile = "3.27.0"
